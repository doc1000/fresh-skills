[project]
name = "fresh-skills"
version = "0.1.0"
description = "Weekly playbook-maintenance agent (LangGraph + BERTopic integration)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bertopic>=0.16",
    "deepagents>=0.7.13",
    "duckdb>=1.2",
    "langchain>=1.4.0",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playbook"]

[tool.hatch.build.targets.wheel.sources]
"src/playbook" = "playbook"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real agent and the OpenAI API (deselected by default; run with -m live)",
]
