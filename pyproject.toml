[project]
name = "fresh-skills"
version = "0.1.0"
description = "Weekly playbook-maintenance agent (LangGraph EDA / agent cleanup)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.1",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playbook"]

[tool.hatch.build.targets.wheel.sources]
"src/playbook" = "playbook"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "nbclient>=0.10",
    "pytest>=8.0",
]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
