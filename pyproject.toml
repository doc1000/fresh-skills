[project]
name = "fresh-skills"
version = "0.1.0"
description = "Weekly playbook-maintenance agent (Phase 1: ABCD EDA + fixtures)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bertopic>=0.16",
    "duckdb>=1.2",
    "pydantic>=2.0",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playbook"]

[tool.hatch.build.targets.wheel.sources]
"src/playbook" = "playbook"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "pytest>=8.0",
]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
